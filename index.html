  <button>

myCal();

</button>
</p>
</div>


<p class="js-cal"></p>





  <script>


let calculation = localStorage.getItem('calculation') || '';

myCal();

function updateCalculation(value) {
  calculation += value;
  myCal();
localStorage.setItem('calculation', calculation);
}

function myCal() {
    document.querySelector('.js-cal').innerHTML = calculation;

  }


  </script>
